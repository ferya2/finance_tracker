<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Offline — Finance Tracker</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --surface: #f9fafb;
        --border: #e4e4e7;
        --text: #09090b;
        --muted: #52525b;
        --accent: #059669;
        --accent-soft: #d1fae5;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #09090b;
          --surface: #18181b;
          --border: #27272a;
          --text: #fafafa;
          --muted: #a1a1aa;
          --accent: #34d399;
          --accent-soft: rgba(52, 211, 153, 0.12);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      .shell {
        width: min(100%, 28rem);
        padding: 2.5rem;
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        background: var(--surface);
        box-shadow: 0 24px 60px rgba(9, 9, 11, 0.06);
        text-align: center;
        animation: rise 0.5s cubic-bezier(0.25, 0.1, 0.25, 1) both;
      }

      .mark {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.75rem;
        display: grid;
        place-items: center;
        border-radius: 1rem;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        animation: float 4s ease-in-out infinite;
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 2rem;
        letter-spacing: -0.03em;
        line-height: 1.2;
      }

      p.copy {
        margin: 0 auto 2rem;
        max-width: 22rem;
        color: var(--muted);
        line-height: 1.6;
      }

      button {
        border: 0;
        border-radius: 0.75rem;
        padding: 0.8rem 1.5rem;
        background: var(--accent);
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, filter 0.2s ease;
      }

      button:hover {
        transform: translateY(-2px);
        filter: brightness(1.05);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .shell,
        .mark {
          animation: none;
        }

        button {
          transition: none;
        }

        button:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="mark" aria-hidden="true">FT</div>
      <p class="eyebrow">Offline</p>
      <h1>You're offline.</h1>
      <p class="copy">
        Your saved pages are still here. Reconnect to sync your latest numbers.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
